version: '3.8'

networks:
  vadp_fabric_multinode:
    name: vadp_fabric_multinode_net
    driver: bridge

volumes:
  orderer.vadp.com:
  peer0.org1.vadp.com:
  peer0.org2.vadp.com:
  peer0.org3.vadp.com:

services:
  # ── Raft Consensus Orderer Node ─────────────────────────────────────────────
  orderer.vadp.com:
    container_name: orderer.vadp.com
    image: hyperledger/fabric-orderer:2.5.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - orderer.vadp.com:/var/hyperledger/production/orderer
    networks:
      - vadp_fabric_multinode

  # ── Org1 Peer Node (Supreme Court Node) ────────────────────────────────────
  peer0.org1.vadp.com:
    container_name: peer0.org1.vadp.com
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_PEER_ID=peer0.org1.vadp.com
      - CORE_PEER_ADDRESS=peer0.org1.vadp.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.vadp.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.vadp.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_LOGGING_SPEC=INFO
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - peer0.org1.vadp.com:/var/hyperledger/production
    networks:
      - vadp_fabric_multinode

  # ── Org2 Peer Node (Forensic Lab Node) ─────────────────────────────────────
  peer0.org2.vadp.com:
    container_name: peer0.org2.vadp.com
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_PEER_ID=peer0.org2.vadp.com
      - CORE_PEER_ADDRESS=peer0.org2.vadp.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.vadp.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.vadp.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_LOGGING_SPEC=INFO
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - peer0.org2.vadp.com:/var/hyperledger/production
    networks:
      - vadp_fabric_multinode

  # ── Org3 Peer Node (High Court Node) ───────────────────────────────────────
  peer0.org3.vadp.com:
    container_name: peer0.org3.vadp.com
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_PEER_ID=peer0.org3.vadp.com
      - CORE_PEER_ADDRESS=peer0.org3.vadp.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3.vadp.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.vadp.com:8051
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_LOGGING_SPEC=INFO
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "8051:8051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - peer0.org3.vadp.com:/var/hyperledger/production
    networks:
      - vadp_fabric_multinode
