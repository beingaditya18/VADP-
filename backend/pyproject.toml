[project]
name = "VADP-backend"
version = "0.1.0"
description = "VADP: Zero Trust Explainable AI Framework for Secure Judicial Decision Support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Aditya Mandloi"},
]

dependencies = [
    # --- Web Framework ---
    "fastapi[standard]>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "greenlet>=3.0.0",

    # --- Configuration ---
    "pydantic[email]>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "email-validator>=2.0.0",

    # --- Security & Authentication ---
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "cryptography>=42.0.0",

    # --- HTTP Client ---
    "httpx>=0.27.0,<1.0.0",

    # --- AI / ML ---
    "scikit-learn>=1.5.0,<2.0.0",
    "torch>=2.3.0",
    "shap>=0.45.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0,<2.0.0",

    # --- File Processing ---
    "python-magic>=0.4.27",
    "aiofiles>=24.1.0",

    # --- Utilities ---
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]

# Optional: for future PostgreSQL migration
postgres = [
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "B",    # bugbear
    "SIM",  # simplify
    "TCH",  # type-checking
]
ignore = [
    "S101",  # assert used (OK in tests)
    "S105",  # possible hardcoded password (false positives in config)
    "B008",  # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
