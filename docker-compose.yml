# ============================================================
# VADP — Docker Compose (Production & Scalable Offline)
# ============================================================
# Local multi-container deployment:
#   docker-compose up --build
#
# Services:
#   - backend: FastAPI REST API with Zero-Trust PDP & Merkle Engine
#   - frontend: Next.js 16 Web Dashboard & Verification Explorer
#   - postgres: PostgreSQL 16 + pgvector extension for scalable vector search
#   - redis: Redis 7 for sliding-window rate limiting & distributed session cache
# ============================================================

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: VADP-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - backend-db:/app/database
      - backend-uploads:/app/uploads
      - backend-faiss:/app/faiss_indices
      - backend-keys:/app/signing_keys
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: VADP-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: VADP-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nyaya
      - POSTGRES_PASSWORD=nyayazta_password
      - POSTGRES_DB=nyaya_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyaya_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (Rate Limiting & Session Cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: VADP-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  backend-db:
    driver: local
  backend-uploads:
    driver: local
  backend-faiss:
    driver: local
  backend-keys:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
