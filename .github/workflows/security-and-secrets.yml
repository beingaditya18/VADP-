# ============================================================
# VADP — Security & Secrets Audit Workflow
# ============================================================
# Scans repository for exposed secrets, checks python/node dependencies for CVEs,
# and verifies secrets provider configuration syntax.
# ============================================================

name: Security & Secrets Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Secrets & Credential Leak Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Safety / Pip Audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true
